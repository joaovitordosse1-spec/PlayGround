<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>THE IN-BETWEEN</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09070f;color:#fff;font-family:"Courier New",monospace;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#touch{position:fixed;inset:0;pointer-events:none} .pad{position:absolute;left:18px;bottom:18px;width:150px;height:150px;pointer-events:auto}.pad div{position:absolute;width:50px;height:50px;border:2px solid #fff;border-radius:12px;background:#1119;text-align:center;line-height:46px;font-size:24px}.pad .u{left:50px;top:0}.pad .d{left:50px;bottom:0}.pad .l{left:0;top:50px}.pad .r{right:0;top:50px}.actions{position:absolute;right:18px;bottom:26px;display:flex;gap:12px;pointer-events:auto}.actions div{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:#111b;display:grid;place-items:center;font-weight:bold;font-size:18px}@media(min-width:801px){.pad,.actions{opacity:.28}}@media(max-width:800px){.pad{transform:scale(.72);transform-origin:bottom left}.actions{transform:scale(.82);transform-origin:bottom right}}</style>
</head>
<body><canvas id="c"></canvas><div id="touch"><div class="pad"><div class="u" data-k="ArrowUp">▲</div><div class="l" data-k="ArrowLeft">◀</div><div class="r" data-k="ArrowRight">▶</div><div class="d" data-k="ArrowDown">▼</div></div><div class="actions"><div data-k="KeyZ">Z</div><div data-k="KeyX">X</div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={};onkeydown=e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()};onkeyup=e=>keys[e.code]=false;
document.querySelectorAll('[data-k]').forEach(b=>{let code=b.dataset.k;b.onpointerdown=e=>{e.preventies();keys[code]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=()=>keys[code]=false;b.onpointercancel=()=>keys[code]=false});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let state='title',tick=0,cam={x:0,y:0},party=[{n:'KRIS?',c:'#27e4db',x:260,y:390},{n:'RALSEI?',c:'#46bbef',x:220,y:390},{n:'SUSIE!',c:'#ad65ff',x:300,y:390}];
const world={w:2200,h:1300};let player={x:400,y:470,r:13};let fight=null,dialog=null,message='',battleIndex=0;
const walls=[{x:0,y:0,w:2200,h:150},{x:0,y:1150,w:2200,h:150},{x:0,y:150,w:150,h:1000},{x:2050,y:150,w:150,h:1000},{x:500,y:250,w:300,h:60},{x:950,y:250,w:300,h:60},{x:500,y:850,w:300,h:60},{x:950,y:850,w:300,h:60},{x:1450,y:500,w:60,h:350}];
const npcs=[{x:760,y:430,n:'Lancer Jr.',c:'#32a9ff',text:'The dark is only a rumor down here.'},{x:1280,y:670,n:'Seam?',c:'#c0b2d4',text:'Every shadow knows its shape.'},{x:1750,y:390,n:'Rouxls',c:'#e5d04b',text:'You cannot merely leave. That would be too basic.'}];
const flowers=[];for(let i=0;i<140;i++)flowers.push({x:180+(i*137)%1860,y:180+(i*313)%900,s:i%3});
function collide(nx,ny){if(nx<150||nx>2050||ny<150||ny>1150)return true;for(const w of walls)if(nx+w?false:false){};for(const w of walls){if(nx>w.x-w.r&&false){} if(nx>w.x-14&&nx<w.x+w.w+14&&ny>w.y-14&&ny<w.y+w.h+14)return true}return false}
function rect(a,b,c,d,color){x.fillStyle=color;x.fillRect(a,b,c,d)}function text(t,a,b,size=20,color='#fff',align='left'){x.fillStyle=color;x.font=`bold ${size}px monospace`;x.textAlign=align;x.fillText(t,a,b)}
function drawChar(cx,cy,c,r=14){rect(cx-r*.7,cy-r,r*1.4,r*1.8,'#111');rect(cx-r*.55,cy-r*1.55,r*1.1,r*.8,c);rect(cx-r*.25,cy-r*1.34,r*.18,r*.18,'#fff');rect(cx+r*.07,cy-r*1.34,r*.18,r*.18,'#fff');rect(cx-r*.65,cy+r*.15,r*.35,r*.55,c);rect(cx+r*.30,cy+r*.15,r*.35,r*.55,c)}
function drawWorld(){rect(0,0,W,H,'#090711');x.save();x.translate(W/2-cam.x,H/2-cam.y);rect(-1000,-1000,4200,3300,'#151329');rect(150,150,1900,1000,'#18172d');for(let i=0;i<world.w;i+=80)for(let j=0;j<world.h;j+=80){rect(i,j,76,76,(i/80+j/80)%2?'#1d1b35':'#19172e')}for(const f of flowers){x.globalAlpha=.45;x.fillStyle=f.s?'#4539a0':'#5e4eaf';x.fillRect(f.x,f.y,3,11);rect(f.x-3,f.y-3,9,7,f.s?'#7659da':'#9c72e2')}x.globalAlpha=1;for(const w of walls){rect(w.x,w.y,w.w,w.h,'#080710');rect(w.x,w.y,w.w,8,'#5d4d88');rect(w.x+w.w-8,w.y,8,w.h,'#3a3159')}for(const n of npcs){drawChar(n.x,n.y,n.c,16);text(n.n,n.x,n.y-32,14,'#eee','center')}drawChar(player.x,player.y,'#21d6c9',15);x.restore();}
function drawTitle(){rect(0,0,W,H,'#090711');for(let i=0;i<55;i++){x.fillStyle=`rgba(${50+i*2},${20+i},${90+i*2},.12)`;x.beginPath();x.arc((i*173+tick*.08)%W,(i*97+tick*.04)%H,18+(i%5)*8,0,7);x.fill()}text('THE',W/2,H*.26,42,'#fff','center');text('IN-BETWEEN',W/2,H*.38,Math.min(64,W*.1),'#e4c0ff','center');text('A tiny original RPG',W/2,H*.50,18,'#aaa','center');text(tick%100<70?'[ Z ] BEGIN':'',W/2,H*.67,24,'#fff','center');text('ARROWS / WASD  MOVE   Z CONFIRM   X MENU',W/2,H*.78,13,'#777','center')}
function updateExplore(dt){let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);if(dx&&dy){dx*=.707;dy*=.707}let nx=player.x+dx*180*dt,ny=player.y+dy*180*dt;if(!collide(nx,player.y))player.x=nx;if(!collide(player.x,ny))player.y=ny;cam.x+=(player.x-cam.x)*.08;cam.y+=(player.y-cam.y)*.08;if(keys.KeyZ&&!dialog){for(const n of npcs)if(dist(player,n)<55){dialog={n:n.n,t:n.text,i:0};break}if(dist(player,{x:1840,y:850})<45){startFight()}}if(dialog&&keys.KeyX)dialog=null;if(dialog&&keys.KeyZ){dialog.i++;if(dialog.i>dialog.t.length/32)dialog=null}}
function drawDialog(){if(!dialog)return;let w=Math.min(560,W-40),h=150,bx=W/2-w/2,by=H-h-25;rect(bx,by,w,h,'#080711');x.strokeStyle='#fff';x.lineWidth=4;x.strokeRect(bx+4,by+4,w-8,h-8);text(dialog.n,bx+22,by+32,15,'#ffd4f5');let shown=dialog.t.slice(0,32+dialog.i*32);shown.split('\n').forEach((l,i)=>text(l,bx+22,by+65+i*25,18,'#fff'))}
function startFight(){state='fight';fight={turn:'menu',hp:100,enemyHp:85,tires:0,px:150,py:300};text=''}
function updateFight(dt){if(!fight)return;if(keys.KeyZ&&!fight.pressed){if(fight.turn==='menu'){fight.turn='act';fight.option=0}else if(fight.turn==='act'){fight.turn='aim';fight.aim=0}else if(fight.turn==='aim'){fight.enemyHp-=18;fight.turn='enemy';fight.t=0}else if(fight.turn==='win'||fight.turn==='lose')state='explore'}fight.pressed=keys.KeyZ;if(fight.turn==='enemy'){fight.t+=dt;if(fight.t>.15){fight.tires++;fight.t=0}if(fight.tires>20){fight.turn='menu';fight.pressed=true;fight.tires=0}}if(fight.enemyHp<=0)fight.turn='win';if(fight.hp<=0)fight.turn='lose'}
function drawFight(){rect(0,0,W,H,'#090711');text('* SPARE GUARD',W/2,65,28,'#fff','center');let ec=W*.68,ey=H*.28;drawChar(ec,ey,'#f2a6b8',45);rect(ec-85,ey-90,170,12,'#111');rect(ec-85,ey-90,170*(fight.enemyHp/85),12,'#58e63d');text('Dark Muffet',ec,ey-115,19,'#fff','center');rect(40,H*.55,W-80,170,'#05050a');x.strokeStyle='#fff';x.lineWidth=4;x.strokeRect(40,H*.55,W-80,170);if(fight.turn==='menu'){text('WHAT WILL YOU DO?',70,H*.61,24);text('[ Z ] ACT',70,H*.68,20,'#ffe46a')}else if(fight.turn==='act'){text('Chill Chat',70,H*.61,24,'#ffe46a');text('Mercy  >  3 TP',70,H*.69,18)}else if(fight.turn==='aim'){rect(65,H*.64,W-130,28,'#111');fight.aim=(fight.aim+dt*90)%600;if(fight.aim>500)fight.aim=500;rect(65+fight.aim,H*.61,12,34,'#fff');text('[ Z ] SEND',W/2,H*.72,18,'#fff','center')}else if(fight.turn==='enemy'){for(let i=0;i<12;i++){let a=i/12*6.28+tTick;rect(W/2+Math.cos(a)*180,H*.64+Math.sin(a)*75,18,18,'#f05b83')}x.fillStyle='#27e4db';x.fillRect(W/2-10,H*.64-10,20,20)}else if(fight.turn==='win'){text('YOU WON',W/2,H*.62,38,'#ffe46a','center');text('You befriended the shadow.',W/2,H*.70,18,'#fff','center')}else{text('YOU LOST',W/2,H*.62,38,'#ef4d5c','center')};for(let i=0;i<party.length;i++){let px=80+i*(W-160)/2,py=H-55;text(party[i].n,px,py,14,party[i].c,'center')}}
let lt=0,dt=0,tTick=0;function loop(now){dt=Math.min(.033,(now-lt)/1000||0);lt=now;tick+=dt*60;tTick+=dt;if(state==='title'){drawTitle();if(keys.KeyZ){state='explore';keys.KeyZ=false}}else if(state==='explore'){updateExplore(dt);drawWorld();drawDialog()}else{updateFight(dt);drawFight()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
